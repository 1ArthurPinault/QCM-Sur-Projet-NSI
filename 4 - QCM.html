<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Cards — Générateur de QCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  /* ════════════════════════════════════
     DESIGN SYSTEM — Thème "Terminal Épuré"
     ════════════════════════════════════ */
  :root {
    --bg:        #0d0f1a;
    --surface:   #141625;
    --panel:     #1c1f35;
    --border:    #2a2f52;
    --accent:    #5c6ef8;
    --accent2:   #a78bfa;
    --green:     #34d399;
    --orange:    #fb923c;
    --red:       #f87171;
    --yellow:    #fbbf24;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --code-bg:   #0a0c17;
    --radius:    14px;
    --radius-sm: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── Bruit de fond subtil ─── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }

  /* ─── Header ─── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,15,26,.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }

  .logo {
    display: flex; align-items: center; gap: 10px;
  }
  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity: .6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  .logo h1 { font-size: .95rem; font-weight: 700; letter-spacing: .04em; }
  .logo span { color: var(--accent); }

  /* ─── Progress bar ─── */
  .progress-wrap {
    display: flex; align-items: center; gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: .8rem; color: var(--muted);
  }
  .progress-bar {
    width: 160px; height: 4px;
    background: var(--border); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .5s ease;
  }

  /* ─── Tabs navigation ─── */
  .nav-tabs {
    display: flex; gap: 6px;
    padding: 20px 32px 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab-btn {
    font-family: 'Sora', sans-serif;
    font-size: .8rem; font-weight: 500;
    padding: 10px 18px;
    background: transparent; border: none; cursor: pointer;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: all .2s; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: .65rem; padding: 2px 6px;
    background: var(--panel); border-radius: 99px;
    color: var(--muted);
  }

  /* ─── Section container ─── */
  .section { display: none; padding: 32px; max-width: 860px; margin: 0 auto; }
  .section.active { display: block; }

  .section-title {
    font-size: 1.1rem; font-weight: 700;
    color: var(--accent2); margin-bottom: 28px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  /* ════════════════════════════
     FLASH CARDS (flip)
     ════════════════════════════ */
  .cards-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin-bottom: 28px; flex-wrap: wrap;
  }
  .cards-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: .9rem; color: var(--muted); min-width: 60px; text-align: center;
  }
  .nav-btn {
    font-family: 'Sora', sans-serif; font-size: .85rem; font-weight: 600;
    padding: 10px 22px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); cursor: pointer;
    background: var(--panel); color: var(--text);
    transition: all .2s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: .35; cursor: not-allowed; }

  .flip-hint {
    text-align: center; font-size: .75rem; color: var(--muted);
    margin-bottom: 20px; letter-spacing: .06em;
    font-family: 'JetBrains Mono', monospace;
  }

  .card-scene {
    perspective: 1200px;
    max-width: 700px; min-height: 320px;
    margin: 0 auto;
    cursor: pointer;
  }
  .card-inner {
    position: relative; width: 100%; min-height: 320px;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,0,.2,1);
  }
  .card-scene.flipped .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: var(--radius);
    padding: 36px 40px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .card-front {
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 4px 40px rgba(92,110,248,.08);
  }
  .card-back {
    background: var(--panel);
    border: 1px solid var(--accent);
    box-shadow: 0 4px 40px rgba(92,110,248,.15);
    transform: rotateY(180deg);
  }

  .card-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: .65rem; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-tag::before {
    content: ''; display: inline-block;
    width: 20px; height: 1px; background: var(--accent);
  }

  .card-question {
    font-size: 1.15rem; font-weight: 500; line-height: 1.65;
    color: var(--text);
  }
  .card-answer {
    font-size: .98rem; line-height: 1.7; color: #c4d1e8;
  }
  .card-answer code, .card-question code {
    font-family: 'JetBrains Mono', monospace;
    font-size: .85em;
    background: var(--code-bg);
    color: var(--green);
    padding: 2px 7px; border-radius: 5px;
  }
  .card-answer .highlight { color: var(--accent2); font-weight: 600; }
  .card-answer ul { padding-left: 18px; margin-top: 10px; }
  .card-answer li { margin-bottom: 6px; }

  .flip-indicator {
    position: absolute; bottom: 16px; right: 20px;
    font-size: .7rem; color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .category-pill {
    display: inline-block;
    font-size: .65rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em; padding: 3px 10px; border-radius: 99px;
    margin-bottom: 16px;
  }
  .cat-python { background: rgba(251,191,36,.15); color: var(--yellow); }
  .cat-js     { background: rgba(251,191,36,.12); color: #f0d060; }
  .cat-html   { background: rgba(251,130,74,.15); color: var(--orange); }
  .cat-css    { background: rgba(92,110,248,.2); color: var(--accent); }
  .cat-archi  { background: rgba(167,139,250,.15); color: var(--accent2); }

  /* ════════════════════════════
     QCM
     ════════════════════════════ */
  .qcm-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 30px 34px;
    margin-bottom: 24px;
    transition: border-color .2s;
  }
  .qcm-question {
    font-size: 1rem; font-weight: 600; margin-bottom: 20px;
    line-height: 1.6;
  }
  .qcm-question code {
    font-family: 'JetBrains Mono', monospace;
    font-size: .85em;
    background: var(--code-bg); color: var(--green);
    padding: 2px 7px; border-radius: 5px;
  }
  .qcm-options { display: flex; flex-direction: column; gap: 10px; }
  .qcm-option {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    cursor: pointer; transition: all .18s;
    font-size: .9rem; line-height: 1.5;
    background: transparent; text-align: left;
    color: var(--text); font-family: 'Sora', sans-serif;
  }
  .qcm-option:hover { border-color: var(--accent); background: rgba(92,110,248,.06); }
  .qcm-option.selected { border-color: var(--accent2); background: rgba(167,139,250,.1); }
  .qcm-option.correct  { border-color: var(--green); background: rgba(52,211,153,.1); color: var(--green); }
  .qcm-option.wrong    { border-color: var(--red); background: rgba(248,113,113,.08); color: var(--red); }
  .qcm-option .opt-letter {
    font-family: 'JetBrains Mono', monospace; font-size: .75rem;
    min-width: 22px; height: 22px;
    border: 1px solid var(--border); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
    color: var(--muted);
  }
  .qcm-option.selected .opt-letter { border-color: var(--accent2); color: var(--accent2); }
  .qcm-option.correct .opt-letter  { border-color: var(--green); color: var(--green); }
  .qcm-option.wrong .opt-letter    { border-color: var(--red); color: var(--red); }
  .qcm-option code {
    font-family: 'JetBrains Mono', monospace; font-size: .82em;
    background: var(--code-bg); color: var(--green); padding: 1px 5px; border-radius: 4px;
  }

  .qcm-feedback {
    margin-top: 14px; padding: 12px 16px;
    border-radius: var(--radius-sm); font-size: .875rem; line-height: 1.6;
    display: none;
  }
  .qcm-feedback.show { display: block; }
  .qcm-feedback.ok  { background: rgba(52,211,153,.1); border-left: 3px solid var(--green); color: #9de8ca; }
  .qcm-feedback.ko  { background: rgba(248,113,113,.08); border-left: 3px solid var(--red); color: #f4a0a0; }
  .qcm-feedback code { font-family:'JetBrains Mono',monospace; background:var(--code-bg); padding:1px 5px; border-radius:4px; color:var(--green); }

  .qcm-actions { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .btn-check {
    font-family: 'Sora', sans-serif; font-size: .82rem; font-weight: 600;
    padding: 9px 20px; border-radius: var(--radius-sm);
    background: var(--accent); color: #fff; border: none; cursor: pointer;
    transition: opacity .2s;
  }
  .btn-check:hover { opacity: .85; }
  .btn-check:disabled { opacity: .4; cursor: not-allowed; }
  .btn-reset-qcm {
    font-family: 'Sora', sans-serif; font-size: .82rem; font-weight: 500;
    padding: 9px 20px; border-radius: var(--radius-sm);
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); cursor: pointer; transition: all .2s;
  }
  .btn-reset-qcm:hover { color: var(--text); border-color: var(--muted); }

  /* ════════════════════════════
     FILL-IN-THE-BLANK
     ════════════════════════════ */
  .fill-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 30px 34px; margin-bottom: 24px;
  }
  .fill-statement {
    font-size: .98rem; line-height: 1.9; margin-bottom: 20px; color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }
  .fill-statement .blank-word {
    display: inline-block; min-width: 120px; height: 26px;
    border-bottom: 2px solid var(--accent);
    background: rgba(92,110,248,.07);
    border-radius: 3px 3px 0 0;
    vertical-align: bottom;
    font-style: italic; color: var(--muted);
    padding: 0 6px; font-size: .88rem;
    cursor: text; outline: none;
    font-family: 'JetBrains Mono', monospace;
    transition: border-color .2s, background .2s;
  }
  .fill-statement .blank-word:focus {
    border-color: var(--accent2); background: rgba(167,139,250,.1);
    color: var(--text);
  }
  .fill-statement .blank-word.correct-blank {
    border-color: var(--green); background: rgba(52,211,153,.1); color: var(--green);
  }
  .fill-statement .blank-word.wrong-blank {
    border-color: var(--red); background: rgba(248,113,113,.08); color: var(--red);
  }
  .fill-context {
    font-size: .8rem; color: var(--muted); margin-bottom: 18px;
    font-family: 'Sora', sans-serif;
  }
  .fill-context code { font-family:'JetBrains Mono',monospace; color: var(--green); font-size: .85em; }
  .fill-result {
    margin-top: 14px; font-size: .875rem; display: none;
    padding: 12px 16px; border-radius: var(--radius-sm); line-height: 1.6;
  }
  .fill-result.show { display: block; }
  .fill-result.ok { background: rgba(52,211,153,.1); border-left: 3px solid var(--green); color: #9de8ca; }
  .fill-result.ko { background: rgba(248,113,113,.08); border-left: 3px solid var(--red); color: #f4a0a0; }
  .fill-result code { font-family:'JetBrains Mono',monospace; background:var(--code-bg); padding:1px 5px; border-radius:4px; color:var(--green); }

  /* ════════════════════════════
     VRAI / FAUX
     ════════════════════════════ */
  .vf-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 26px 32px; margin-bottom: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .vf-statement { font-size: .98rem; line-height: 1.65; }
  .vf-statement code { font-family:'JetBrains Mono',monospace; background:var(--code-bg); color:var(--green); padding:2px 6px; border-radius:4px; font-size:.85em; }
  .vf-btns { display: flex; gap: 10px; }
  .vf-btn {
    font-family: 'Sora', sans-serif; font-size: .82rem; font-weight: 700;
    padding: 10px 28px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); cursor: pointer;
    background: transparent; color: var(--text); transition: all .18s;
    letter-spacing: .04em;
  }
  .vf-btn[data-val="true"]:hover  { border-color: var(--green); color: var(--green); background: rgba(52,211,153,.07); }
  .vf-btn[data-val="false"]:hover { border-color: var(--red); color: var(--red); background: rgba(248,113,113,.07); }
  .vf-btn.correct { border-color: var(--green); background: rgba(52,211,153,.12); color: var(--green); }
  .vf-btn.wrong   { border-color: var(--red); background: rgba(248,113,113,.1); color: var(--red); }
  .vf-btn:disabled { cursor: default; }
  .vf-expl {
    font-size: .85rem; line-height: 1.6; display: none;
    padding: 10px 14px; border-radius: var(--radius-sm);
    background: var(--panel);
  }
  .vf-expl.show { display: block; }
  .vf-expl code { font-family:'JetBrains Mono',monospace; background:var(--code-bg); color:var(--green); padding:1px 5px; border-radius:4px; font-size:.85em; }

  /* ════════════════════════════
     SCORE GLOBAL
     ════════════════════════════ */
  .score-panel {
    display: flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: var(--muted);
  }
  .score-num { color: var(--green); font-weight: 700; }

  /* ─── Reset all btn ─── */
  .btn-global-reset {
    font-family: 'Sora', sans-serif; font-size: .8rem; font-weight: 600;
    padding: 8px 18px; border-radius: var(--radius-sm);
    background: rgba(248,113,113,.1); color: var(--red);
    border: 1px solid rgba(248,113,113,.3); cursor: pointer; transition: all .2s;
  }
  .btn-global-reset:hover { background: rgba(248,113,113,.2); }

  /* ─── Responsive / Mobile-first ─── */

  /* Carte flip : hauteur min adaptée au contenu sur mobile */
  @media (max-width: 480px) {
    .card-scene { min-height: 260px; }
    .card-inner { min-height: 260px; }
    .card-face  { padding: 22px 18px; min-height: 260px; }
    .card-question { font-size: 1rem; }
    .card-answer   { font-size: .9rem; }

    /* Header compact */
    header { padding: 10px 14px; gap: 10px; }
    .logo h1 { font-size: .82rem; }
    .progress-bar { width: 100px; }
    .progress-wrap { font-size: .7rem; }

    /* Onglets défilables sans texte coupé */
    .nav-tabs { padding: 12px 14px 0; gap: 4px; }
    .tab-btn  { font-size: .72rem; padding: 8px 12px; }

    /* Sections */
    .section { padding: 16px 14px; }

    /* Cards exercices */
    .qcm-card, .fill-card, .vf-card { padding: 18px 14px; }
    .qcm-question { font-size: .9rem; }
    .qcm-option   { padding: 10px 12px; font-size: .85rem; }

    /* Boutons navigation flash cards */
    .cards-nav { gap: 10px; }
    .nav-btn   { padding: 8px 14px; font-size: .78rem; }

    /* Fill blanks */
    .fill-statement { font-size: .88rem; }
    .blank-word     { min-width: 90px; }

    /* Vrai/faux */
    .vf-btns  { flex-direction: column; gap: 8px; }
    .vf-btn   { width: 100%; text-align: center; padding: 12px; }

    /* Bouton reset global */
    .btn-global-reset { font-size: .72rem; padding: 6px 12px; }

    /* Flip hint */
    .flip-hint { font-size: .68rem; }
  }

  @media (max-width: 600px) {
    header { padding: 14px 18px; }
    .nav-tabs { padding: 16px 18px 0; }
    .section { padding: 20px 18px; }
    .card-face { padding: 26px 24px; }
    .qcm-card, .fill-card, .vf-card { padding: 22px 20px; }

    /* Touch targets minimum 44px pour accessibilité mobile */
    .nav-btn, .btn-check, .btn-reset-qcm, .vf-btn {
      min-height: 44px;
    }
    .qcm-option { min-height: 44px; align-items: center; }

    /* Désactivation des hover transform sur touch (évite le bug sticky hover) */
    .qcm-option:hover  { transform: none; }

    /* Progress bar plus large sur mobile */
    .progress-bar { width: 120px; }

    /* Section title plus compact */
    .section-title { font-size: .95rem; margin-bottom: 20px; }
  }

  /* Empêche le débordement horizontal sur très petits écrans */
  @media (max-width: 360px) {
    .tab-btn { font-size: .66rem; padding: 6px 8px; }
    .card-question { font-size: .92rem; }
    .fill-statement { font-size: .82rem; line-height: 1.7; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <h1>Flash Cards &mdash; <span>Générateur QCM</span></h1>
  </div>
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div class="progress-wrap">
      <span id="progress-label">0 / 0</span>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="score-panel">score : <span class="score-num" id="global-score">0</span></div>
    <button class="btn-global-reset" onclick="resetAll()">↺ reset</button>
  </div>
</header>

<!-- Navigation par onglets -->
<div class="nav-tabs" id="nav-tabs">
  <button class="tab-btn active" onclick="switchTab('flashcards',this)">
    🃏 Flash Cards <span class="tab-badge" id="fc-badge">0</span>
  </button>
  <button class="tab-btn" onclick="switchTab('qcm',this)">
    ❓ QCM <span class="tab-badge" id="qcm-badge">0</span>
  </button>
  <button class="tab-btn" onclick="switchTab('fill',this)">
    ✏️ Trous à compléter <span class="tab-badge" id="fill-badge">0</span>
  </button>
  <button class="tab-btn" onclick="switchTab('vf',this)">
    ✔️ Vrai / Faux <span class="tab-badge" id="vf-badge">0</span>
  </button>
</div>

<!-- ════════════════ FLASH CARDS ════════════════ -->
<div class="section active" id="section-flashcards">
  <div class="section-title">🃏 Flash Cards — cliquez pour retourner</div>
  <p class="flip-hint">← → pour naviguer &nbsp;|&nbsp; Espace pour retourner</p>

  <div class="cards-nav">
    <button class="nav-btn" id="fc-prev" onclick="fcMove(-1)">← Précédente</button>
    <div class="cards-counter" id="fc-counter">1 / 20</div>
    <button class="nav-btn" id="fc-next" onclick="fcMove(1)">Suivante →</button>
  </div>

  <div class="card-scene" id="fc-scene" onclick="fcFlip()">
    <div class="card-inner" id="fc-inner">
      <div class="card-face card-front" id="fc-front">
        <div class="card-tag" id="fc-tag">Python</div>
        <div class="category-pill" id="fc-cat"></div>
        <div class="card-question" id="fc-q"></div>
        <div class="flip-indicator">cliquer pour révéler ▸</div>
      </div>
      <div class="card-face card-back" id="fc-back">
        <div class="card-tag" id="fc-tag-b">Réponse</div>
        <div class="card-answer" id="fc-a"></div>
        <div class="flip-indicator">◂ cliquer pour revenir</div>
      </div>
    </div>
  </div>
</div>

function switchTab(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  btn.classList.add('active');
}

// ════════════════════════════════════════════════
const CAT_CLASSES = { python:'cat-python', js:'cat-js', html:'cat-html', css:'cat-css', archi:'cat-archi' };

function fcRender() {
  const card = FC_DATA[fcIndex];
  const scene = document.getElementById('fc-scene');
  scene.classList.remove('flipped');

  // Remove all cat classes and re-add
  const catEl = document.getElementById('fc-cat');
  catEl.className = 'category-pill ' + (CAT_CLASSES[card.cat] || '');
  catEl.textContent = card.catLabel;

  document.getElementById('fc-tag').textContent = card.catLabel + ' — Question';
  document.getElementById('fc-tag-b').textContent = 'Réponse';
  document.getElementById('fc-q').innerHTML = card.q;
  document.getElementById('fc-a').innerHTML = card.a;
  document.getElementById('fc-counter').textContent = `${fcIndex + 1} / ${FC_DATA.length}`;
  document.getElementById('fc-prev').disabled = fcIndex === 0;
  document.getElementById('fc-next').disabled = fcIndex === FC_DATA.length - 1;
}

function fcFlip() {
  document.getElementById('fc-scene').classList.toggle('flipped');
}

function fcMove(dir) {
  const next = fcIndex + dir;
  if (next >= 0 && next < FC_DATA.length) {
    fcIndex = next;
    fcRender();
  }
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (document.getElementById('section-flashcards').classList.contains('active')) {
    if (e.key === 'ArrowRight') fcMove(1);
    if (e.key === 'ArrowLeft')  fcMove(-1);
    if (e.key === ' ') { e.preventDefault(); fcFlip(); }
  }
});

// ════════════════════════════════════════════════
//  QCM BUILD
// ════════════════════════════════════════════════
function buildQCM() {
  const container = document.getElementById('qcm-container');
  const letters = ['A', 'B', 'C', 'D'];

  QCM_DATA.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'qcm-card';
    div.id = `qcm-${qi}`;

    const catClass = CAT_CLASSES[q.cat] || '';
    let optsHTML = q.opts.map((opt, oi) => `
      <button class="qcm-option" onclick="qcmSelect(${qi}, ${oi})" id="qcm-opt-${qi}-${oi}">
        <span class="opt-letter">${letters[oi]}</span>
        <span>${opt}</span>
      </button>`).join('');

    div.innerHTML = `
      <span class="category-pill ${catClass}" style="margin-bottom:12px;display:inline-block">${q.cat.toUpperCase()}</span>
      <div class="qcm-question">${q.q}</div>
      <div class="qcm-options">${optsHTML}</div>
      <div class="qcm-actions">
        <button class="btn-check" id="qcm-check-${qi}" onclick="qcmCheck(${qi})" disabled>Vérifier</button>
        <button class="btn-reset-qcm" onclick="qcmReset(${qi})">↺</button>
      </div>
      <div class="qcm-feedback" id="qcm-fb-${qi}"></div>`;

    container.appendChild(div);
  });
}

let qcmSelected = {};
let qcmDone = {};

function qcmSelect(qi, oi) {
  if (qcmDone[qi]) return;
  qcmSelected[qi] = oi;
  // Update UI
  QCM_DATA[qi].opts.forEach((_, idx) => {
    const el = document.getElementById(`qcm-opt-${qi}-${idx}`);
    el.classList.toggle('selected', idx === oi);
  });
  document.getElementById(`qcm-check-${qi}`).disabled = false;
}

function qcmCheck(qi) {
  if (qcmDone[qi]) return;
  qcmDone[qi] = true;
  const q = QCM_DATA[qi];
  const chosen = qcmSelected[qi];
  const correct = q.correct;

  q.opts.forEach((_, idx) => {
    const el = document.getElementById(`qcm-opt-${qi}-${idx}`);
    el.disabled = true;
    if (idx === correct) el.classList.add('correct');
    else if (idx === chosen && idx !== correct) el.classList.add('wrong');
  });

  const fb = document.getElementById(`qcm-fb-${qi}`);
  const isCorrect = chosen === correct;
  fb.className = 'qcm-feedback show ' + (isCorrect ? 'ok' : 'ko');
  fb.innerHTML = isCorrect
    ? `✅ <strong>Correct !</strong> ${q.expl}`
    : `❌ <strong>Incorrect.</strong> ${q.expl}`;

  document.getElementById(`qcm-check-${qi}`).disabled = true;
  if (isCorrect) addScore(1);
  updateProgress();
}

function qcmReset(qi) {
  delete qcmDone[qi];
  delete qcmSelected[qi];
  QCM_DATA[qi].opts.forEach((_, idx) => {
    const el = document.getElementById(`qcm-opt-${qi}-${idx}`);
    el.className = 'qcm-option';
    el.disabled = false;
    el.onclick = () => qcmSelect(qi, idx);
  });
  const fb = document.getElementById(`qcm-fb-${qi}`);
  fb.className = 'qcm-feedback';
  fb.innerHTML = '';
  document.getElementById(`qcm-check-${qi}`).disabled = true;
}

// ════════════════════════════════════════════════
//  FILL IN THE BLANK BUILD
// ════════════════════════════════════════════════
function buildFill() {
  const container = document.getElementById('fill-container');

  FILL_DATA.forEach((f, fi) => {
    const div = document.createElement('div');
    div.className = 'fill-card';
    div.id = `fill-${fi}`;
    const catClass = CAT_CLASSES[f.cat] || '';

    // Replace ___N___ with input fields
    let stmtHTML = f.statement;
    f.blanks.forEach((_, bi) => {
      stmtHTML = stmtHTML.replace(
        `___${bi+1}___`,
        `<span class="blank-word" contenteditable="true" id="fill-${fi}-${bi}" 
          data-answer="${f.answers[bi]}"
          title="Indice : ${f.hints[bi]}"
          onkeydown="if(event.key==='Enter'){event.preventDefault();fillCheck(${fi})}"
          ></span>`
      );
    });

    div.innerHTML = `
      <span class="category-pill ${catClass}" style="margin-bottom:10px;display:inline-block">${f.cat.toUpperCase()}</span>
      <div class="fill-context">${f.context}</div>
      <div class="fill-statement">${stmtHTML}</div>
      <div class="qcm-actions">
        <button class="btn-check" onclick="fillCheck(${fi})">Vérifier</button>
        <button class="btn-reset-qcm" onclick="fillReset(${fi})">↺</button>
      </div>
      <div class="fill-result" id="fill-res-${fi}"></div>`;

    container.appendChild(div);
  });
}

let fillDone = {};

function fillCheck(fi) {
  if (fillDone[fi]) return;
  const f = FILL_DATA[fi];
  let allCorrect = true;
  let details = [];

  f.blanks.forEach((_, bi) => {
    const input = document.getElementById(`fill-${fi}-${bi}`);
    const typed = input.textContent.trim().replace(/^["']|["']$/g,'');
    const expected = f.answers[bi].replace(/^["']|["']$/g,'');
    const ok = typed.toLowerCase() === expected.toLowerCase();
    if (!ok) allCorrect = false;

    input.classList.remove('correct-blank','wrong-blank');
    input.classList.add(ok ? 'correct-blank' : 'wrong-blank');
    input.contentEditable = false;
    if (!ok) details.push(`Blanc ${bi+1} : attendu <code>${f.answers[bi]}</code>, saisi <code>${typed || '(vide)'}</code>`);
  });

  fillDone[fi] = true;
  const res = document.getElementById(`fill-res-${fi}`);
  res.className = 'fill-result show ' + (allCorrect ? 'ok' : 'ko');
  res.innerHTML = allCorrect
    ? `✅ <strong>Parfait !</strong> Tous les blancs sont corrects.`
    : `❌ <strong>Erreur.</strong> ${details.join(' | ')}`;

  if (allCorrect) addScore(f.blanks.length);
  updateProgress();
}

function fillReset(fi) {
  delete fillDone[fi];
  const f = FILL_DATA[fi];
  f.blanks.forEach((_, bi) => {
    const input = document.getElementById(`fill-${fi}-${bi}`);
    input.textContent = '';
    input.className = 'blank-word';
    input.contentEditable = true;
  });
  const res = document.getElementById(`fill-res-${fi}`);
  res.className = 'fill-result';
  res.innerHTML = '';
}

// ════════════════════════════════════════════════
//  VRAI / FAUX BUILD
// ════════════════════════════════════════════════
function buildVF() {
  const container = document.getElementById('vf-container');

  VF_DATA.forEach((item, vi) => {
    const div = document.createElement('div');
    div.className = 'vf-card';
    div.id = `vf-${vi}`;
    const catClass = CAT_CLASSES[item.cat] || '';

    div.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px">
        <span class="category-pill ${catClass}">${item.cat.toUpperCase()}</span>
      </div>
      <div class="vf-statement">${item.statement}</div>
      <div class="vf-btns">
        <button class="vf-btn" data-val="true"  onclick="vfAnswer(${vi}, true)"  id="vf-t-${vi}">VRAI</button>
        <button class="vf-btn" data-val="false" onclick="vfAnswer(${vi}, false)" id="vf-f-${vi}">FAUX</button>
      </div>
      <div class="vf-expl" id="vf-expl-${vi}">${item.expl}</div>`;

    container.appendChild(div);
  });
}

let vfDone = {};

function vfAnswer(vi, val) {
  if (vfDone[vi]) return;
  vfDone[vi] = true;
  const item = VF_DATA[vi];
  const correct = val === item.answer;

  const tBtn = document.getElementById(`vf-t-${vi}`);
  const fBtn = document.getElementById(`vf-f-${vi}`);
  tBtn.disabled = true; fBtn.disabled = true;

  // Style the chosen button
  const chosenBtn = val ? tBtn : fBtn;
  const otherBtn  = val ? fBtn : tBtn;
  chosenBtn.classList.add(correct ? 'correct' : 'wrong');
  // Always show correct answer
  if (!correct) (item.answer ? tBtn : fBtn).classList.add('correct');

  document.getElementById(`vf-expl-${vi}`).classList.add('show');
  if (correct) addScore(1);
  updateProgress();
}

// ════════════════════════════════════════════════
//  SCORE & PROGRESS
// ════════════════════════════════════════════════
function addScore(n) {
  globalScore += n;
  document.getElementById('global-score').textContent = globalScore;
}

function updateProgress() {
  const answered = Object.keys(qcmDone).length + Object.keys(fillDone).length + Object.keys(vfDone).length;
  const total = QCM_DATA.length + FILL_DATA.length + VF_DATA.length;
  const pct = total > 0 ? Math.round(answered / total * 100) : 0;
  document.getElementById('progress-label').textContent = `${answered} / ${total}`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ════════════════════════════════════════════════
//  RESET ALL
// ════════════════════════════════════════════════
function resetAll() {
  if (!confirm('Réinitialiser tous les exercices ?')) return;
  globalScore = 0;
  document.getElementById('global-score').textContent = 0;

  // Reset QCM
  qcmSelected = {}; qcmDone = {};
  QCM_DATA.forEach((_, qi) => qcmReset(qi));

  // Reset Fill
  fillDone = {};
  FILL_DATA.forEach((_, fi) => fillReset(fi));

  // Reset VF
  vfDone = {};
  VF_DATA.forEach((_, vi) => {
    const t = document.getElementById(`vf-t-${vi}`);
    const f = document.getElementById(`vf-f-${vi}`);
    const e = document.getElementById(`vf-expl-${vi}`);
    [t,f].forEach(b => { b.disabled = false; b.className = 'vf-btn'; });
    e.classList.remove('show');
  });

  // Reset FC
  fcIndex = 0; fcRender();
  updateProgress();
}
